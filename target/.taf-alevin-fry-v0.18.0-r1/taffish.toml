[package]
name = "alevin-fry"
kind = "tool"
version = "0.18.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/alevin-fry"

[command]
name = "taf-alevin-fry"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/alevin-fry:0.18.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["single-cell", "single-nucleus", "transcriptomics", "gene-expression", "chromatin-accessibility"]
keywords = ["alevin-fry", "scRNA-seq", "snRNA-seq", "scATAC-seq", "RAD", "cell barcode", "UMI", "USA mode", "RNA velocity", "quantification"]
description = "Alevin-fry 0.18.0 for deterministic barcode correction, bounded RAD collation, sc/snRNA-seq quantification, direct quant-to-infer processing, SAM/BAM conversion, RAD viewing, and supported scATAC-seq RAD processing."

[upstream]
name = "alevin-fry"
type = "github"
repo = "COMBINE-lab/alevin-fry"
homepage = "https://github.com/COMBINE-lab/alevin-fry"
manual = "https://alevin-fry.readthedocs.io/en/latest/"
release_url = "https://github.com/COMBINE-lab/alevin-fry/releases/tag/v0.18.0"
downloads = "https://github.com/COMBINE-lab/alevin-fry/releases/download/v0.18.0/alevin-fry-x86_64-unknown-linux-gnu.tar.xz; https://github.com/COMBINE-lab/alevin-fry/releases/download/v0.18.0/alevin-fry-aarch64-unknown-linux-gnu.tar.xz"
version = "0.18.0"
commit = "85d0732413c7fc6352fb55c4a7c151f1a07c29e2"
license = "BSD-3-Clause"
description = "Memory-frugal processing and quantification of single-cell and single-nucleus RNA-seq data, with RAD utilities and scATAC-seq processing interfaces."
citation = "He D, Zakeri M, Sarkar H, Soneson C, Srivastava A, Patro R. Alevin-fry unlocks rapid, accurate and memory-frugal quantification of single-cell RNA-seq data. Nature Methods. 2022;19:316-322."
doi = "10.1038/s41592-022-01408-3"
pmid = "35277707"
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 180
exist = ["alevin-fry", "sh", "grep", "gzip", "ldd", "tr"]
test = ["/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh identity", "/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh interfaces", "/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh rad", "/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh rna", "/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh tiny", "/opt/alevin-fry/share/testdata/alevin-fry-smoke.sh infer"]
